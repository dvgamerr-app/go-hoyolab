config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "gofmt"

[[plugin]]
name = "golangci-lint"
drivers = [
  "lint",
]
mode = "comment"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-go"
mode = "monitor"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# Baseline: existing findings are tracked as separate follow-up work.
# - radarlint-go: cognitive complexity / duplicated literals in existing code.
# - osv-scanner: Go stdlib and golang.org/x/net advisories; fixing needs a Go/dependency upgrade.
# - zizmor/actionlint: hardening of the existing release and Pages deploy workflows.
[[exclude]]
plugins = ["radarlint-go"]
file_patterns = ["**/*.go"]

[[exclude]]
plugins = ["osv-scanner"]
file_patterns = ["go.mod", "go.sum"]

[[exclude]]
plugins = ["zizmor", "actionlint"]
file_patterns = [".github/workflows/build.yml", ".github/workflows/gh-pages.yml"]
